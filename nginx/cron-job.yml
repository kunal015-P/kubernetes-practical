apiVersion: batch/v1
kind: CronJob
metadata:
  name: hello-cronjob
  namespace: nginx
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: busybox:1.36
              command:
                - sh
                - -c
                - 'echo "Hello from Kubernetes CronJob"'
          restartPolicy: OnFailure
